    [BC]🔫 Ruleta rusa

    [C]*clic*...
    [C]<@@{nick}@> tuvo suerte hoy 😮‍💨

  roulette_bang: |
    [BC]🔫 Ruleta rusa

    [C]¡BANG! 💥
    [C]<@@{nick}@> quedó fuera ☠️

  ball_ask: |
    [BC]🎱 Bola mágica

    [C]Haz una pregunta y responderé
    [C]Ejemplo: /8ball ¿lloverá?

  ball_0: "[BC]🎱\n[C]Es seguro"
  ball_1: "[BC]🎱\n[C]Creo que sí"
  ball_2: "[BC]🎱\n[C]Sin duda"
  ball_3: "[BC]🎱\n[C]Muy probablemente"
  ball_4: "[BC]🎱\n[C]Pregunta más tarde"
  ball_5: "[BC]🎱\n[C]No cuentes con ello"
  ball_6: "[BC]🎱\n[C]Muy dudoso"
  ball_7: "[BC]🎱\n[C]Mi respuesta es no"
  ball_8: "[BC]🎱\n[C]Aún no está claro"
  ball_9: "[BC]🎱\n[C]Ni lo pienses"

  percent_ask: |
    [BC]📊 Medidor

    [C]Dime qué medir
    [C]Ejemplo: /percent suerte

  percent: |
    [BC]📊 Resultado de la medición

    [C]<@@{nick}@> tiene
    [BC]{value}%
    [C]{what}

  ship: |
    [BC]💘 Ship del día

    [C]<@@{a}@>  ❤️  <@@{b}@>
    [BC]{love}%

  rps_help: |
    [BC]✊ Piedra-papel-tijera

    [C]Escribe: /rps piedra
    [C]o tijera, o papel

  rps_name_0: "🪨 piedra"
  rps_name_1: "✂️ tijera"
  rps_name_2: "📄 papel"

  rps_win: |
    [BC]✊ Piedra-papel-tijera

    [C]{user}  vs  {bot}
    [C]¡<@@{nick}@> gana! 🎉

  rps_lose: |
    [BC]✊ Piedra-papel-tijera

    [C]{user}  vs  {bot}
    [C]<@@{nick}@> pierde 😢

  rps_draw: |
    [BC]✊ Piedra-papel-tijera

    [C]{user}  vs  {bot}
    [C]Empate 🤝

  who: |
    [BC]🔮 Adivinación

    [C]¿Quién {question}?
    [C]Mi respuesta: <@@{nick}@>

  guess_start: |
    [BC]🔢 Adivina el número

    [C]Pensé un número del 1 al 100
    [C]Escribe /guess <número>

  guess_need_number: |
    [BC]🔢 Adivina el número

    [C]Escribe un número del 1 al 100

  guess_higher: |
    [BC]⬆ Más alto

  guess_lower: |
    [BC]⬇ Más bajo

  guess_win: |
    [BC]🎉 ¡Correcto!

    [C]<@@{nick}@> lo logró
    [C]en {tries} intentos

