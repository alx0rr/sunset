lang: "Español"

common:
  enabled: "✅ activado"
  disabled: "❌ desactivado"
  farewell_text: "Adiós, <@@{nick}@>"
  greeting_text: "¡Bienvenido, <@@{nick}@>!\n¡Eres el miembro #{members} en {title}!\nQué bueno tenerte aquí"
  greeting_text_image: "{nick}, bienvenido a\n{title}\nEres el miembro #{members}"


on_chat_invite: |
  [BC]👋 ¡Hola!
  [C]Soy Sunset — un bot de bienvenidas, juegos, ajustes y mucho más.
  [C]Lista de comandos: /help


help: |
  [BC]Mira lo que puedo hacer [AQUÍ|https://teletype.in/@alx0rr/0oQTU0gJtVX]



games:
  roll: |
    [BC]🎲 Dados

    [C]<@@{nick}@> lanza los dados
    [BC]{a}  ✦  {b}
    [C]Total: {total}

  dice: |
    [BC]🎲 Tirada d{sides}

    [C]<@@{nick}@> saca
    [BC]{result}

  coin_heads: |
    [BC]🪙 Moneda

    [C]<@@{nick}@>, salió
    [BC]Cara

  coin_tails: |
    [BC]🪙 Moneda

    [C]<@@{nick}@>, salió
    [BC]Cruz

  choose: |
    [BC]🤔 Mi elección

    [BC]{pick}

  choose_help: |
    [BC]🤔 ¿Qué elijo?

    [C]Da opciones separadas por coma u "o"
    [C]Ejemplo: /choose té o café

