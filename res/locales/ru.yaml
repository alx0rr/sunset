lang: "Русский"

common:
  enabled: "✅ вкл"
  disabled: "❌ выкл"
  farewell_text: "Прощай, <@{nick}@>"
  greeting_text: "Привет, <@{nick}@>!\nТы {members}-й участник в {title}!\nДобро пожаловать"
  greeting_text_image: "{nick}, добро пожаловать в\n{title}\nТы {members}-й участник"


on_chat_invite: |
  [BC]👋 привет!
  [C]Я Sunset — бот для приветствий, игр настроек и многого другого!.
  [C]Список команд: /help


help: |
  [BC]Посмотреть мои возможности можно [ТУТ|https://teletype.in/@alx0rr/hzMR-L3wnL-]



games:
  roll: |
    [BC]🎲 Кости

    [C]<@{nick}@> бросает кубики
    [BC]{a}  ✦  {b}
    [C]Сумма: {total}

  dice: |
    [BC]🎲 Бросок d{sides}

    [C]<@{nick}@> выбрасывает
    [BC]{result}

  coin_heads: |
    [BC]🪙 Монетка

    [C]<@{nick}@>, выпал
    [BC]Орёл

  coin_tails: |
    [BC]🪙 Монетка

    [C]<@{nick}@>, выпала
    [BC]Решка

  choose: |
    [BC]🤔 Мой выбор

    [BC]{pick}

  choose_help: |
    [BC]🤔 Что выбрать?

    [C]Дай варианты через запятую или «или»
    [C]Пример: /выбери чай или кофе

  roulette_safe: |
    [BC]🔫 Русская рулетка

    [C]*щёлк*...
    [C]<@{nick}@> повезло сегодня 😮‍💨

  roulette_bang: |
    [BC]🔫 Русская рулетка

    [C]БАХ! 💥
    [C]<@{nick}@> выбыл из игры ☠️

  ball_ask: |
    [BC]🎱 Магический шар

    [C]Задай вопрос, и я отвечу
    [C]Пример: /шар будет ли дождь?

  ball_0: "[BC]🎱\n[C]Бесспорно"
  ball_1: "[BC]🎱\n[C]Мне кажется — да"
  ball_2: "[BC]🎱\n[C]Никаких сомнений"
  ball_3: "[BC]🎱\n[C]Вероятнее всего"
  ball_4: "[BC]🎱\n[C]Спроси позже"
  ball_5: "[BC]🎱\n[C]Не рассчитывай на это"
  ball_6: "[BC]🎱\n[C]Весьма сомнительно"
  ball_7: "[BC]🎱\n[C]Мой ответ — нет"
  ball_8: "[BC]🎱\n[C]Пока не ясно"
  ball_9: "[BC]🎱\n[C]Даже не думай"

  percent_ask: |
    [BC]📊 Измеритель

    [C]Укажи, что измерить
    [C]Пример: /процент везения

  percent: |
    [BC]📊 Результат замера

    [C]В <@{nick}@>
    [BC]{value}%
    [C]{what}

  ship: |
    [BC]💘 Шип дня

    [C]<@{a}@>  ❤️  <@{b}@>
    [BC]{love}%

  rps_help: |
    [BC]✊ Камень-ножницы-бумага

    [C]Напиши: /кнб камень
    [C]или ножницы, или бумага

  rps_name_0: "🪨 камень"
  rps_name_1: "✂️ ножницы"
  rps_name_2: "📄 бумага"

  rps_win: |
    [BC]✊ Камень-ножницы-бумага

    [C]{user}  vs  {bot}
    [C]<@{nick}@> победил! 🎉

  rps_lose: |
    [BC]✊ Камень-ножницы-бумага

    [C]{user}  vs  {bot}
    [C]<@{nick}@> проиграл 😢

  rps_draw: |
    [BC]✊ Камень-ножницы-бумага

    [C]{user}  vs  {bot}
    [C]Ничья 🤝

  who: |
    [BC]🔮 Гадание

    [C]Кто {question}?
    [C]Мой ответ: <@{nick}@>

  guess_start: |
    [BC]🔢 Угадай число

    [C]Я загадал число от 1 до 100
    [C]Пиши /guess <число>

  guess_need_number: |
    [BC]🔢 Угадай число

    [C]Нужно число от 1 до 100

  guess_higher: |
    [BC]⬆ Больше

  guess_lower: |
    [BC]⬇ Меньше

  guess_win: |
    [BC]🎉 Угадал!

    [C]<@{nick}@> справился
    [C]за {tries} попыток

chat:
  settings: |
    [BC]⚙ Настройки чата

    [C]「 {name} 」
    [C]👥 {members} участников

    ✦ Приветствия: {greeting} ({greeting_type})
    ✦ Прощания: {farewell}
    ✦ Команды: {commands}

